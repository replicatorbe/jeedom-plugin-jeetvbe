# Jeu d'essai hors ligne du plugin (logique pure, sans Jeedom installé) :
# syntaxe PHP, tests/run.php, syntaxe du JavaScript de la page de configuration.
name: Tests

on:
  push:
    branches: [beta, master]
  pull_request:
    branches: [beta, master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, fileinfo, openssl
          coverage: none

      - name: Syntaxe PHP
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null

      # tests/run.php ne charge que la logique pure (jeetvbeLayout,
      # jeetvbeOverlay) : aucun fichier du cœur de Jeedom n'est nécessaire.
      - name: Jeu d'essai hors ligne
        run: php tests/run.php

      - name: Syntaxe JavaScript
        run: |
          for f in desktop/js/*.js; do node --check "$f"; done
